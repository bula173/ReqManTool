<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Decorative elements - document/requirements symbols -->
  <g fill="none" stroke="url(#text)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Document outline -->
    <path d="M140 120 L372 120 L372 392 L140 392 Z" opacity="0.3"/>
    <path d="M140 120 L372 120 L372 180 L140 180 Z" opacity="0.5"/>
    
    <!-- Lines representing requirements -->
    <line x1="180" y1="220" x2="332" y2="220" opacity="0.7"/>
    <line x1="180" y1="270" x2="332" y2="270" opacity="0.7"/>
    <line x1="180" y1="320" x2="280" y2="320" opacity="0.7"/>
    
    <!-- Link symbol -->
    <path d="M200 380 Q230 380 230 350 Q230 320 200 320" opacity="0.6"/>
    <path d="M312 380 Q282 380 282 350 Q282 320 312 320" opacity="0.6"/>
  </g>
  
  <!-- "RM" text -->
  <text x="256" y="300" text-anchor="middle" fill="url(#text)" 
        font-family="system-ui, sans-serif" font-weight="700" font-size="140" 
        dominant-baseline="central" letter-spacing="-5">RM</text>
  
  <!-- Version badge area (bottom right) -->
  <rect x="380" y="380" width="100" height="40" rx="6" fill="rgba(52,152,219,0.2)"/>
  <text x="430" y="406" text-anchor="middle" fill="#3498db" 
        font-family="system-ui, sans-serif" font-weight="600" font-size="18" 
        dominant-baseline="central">v0.1</text>
</svg>