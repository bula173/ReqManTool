[package]
name = "reqmantool-desktop"
version = "0.1.0"
description = "ReqManTool Desktop App - Local Edition"
authors = ["Marcin Kwiatkowski"]
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-os = "2"
tauri-plugin-http = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
semver = "1.0"
dirs = "5.0"
portpicker = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
notify = "6.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# Ensure the built binary is a Windows GUI application (no console)
[package.metadata.tauri]
windows = { subsystem = "windows" }
