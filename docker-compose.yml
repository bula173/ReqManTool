# ReqManTool Server Edition - Docker Compose
# Usage: docker compose up -d
# Config: Place config.json and server.env in the same directory

services:
  reqman:
    image: reqmantool/server:latest
    container_name: reqman-server
    restart: unless-stopped
    ports:
      - "8899:8899"
    volumes:
      - reqman-data:/data
      - ./config.json:/config.json:ro
      - ./server.env:/server.env:ro
    env_file:
      - ./server.env
    environment:
      - REQMAN_DATA_DIR=/data
      - REQMAN_CONFIG_FILE=/config.json
      - REQMAN_MODE=server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/edition"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Reverse proxy with TLS (uncomment and configure)
  # nginx:
  #   image: nginx:alpine
  #   container_name: reqman-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - reqman

volumes:
  reqman-data:
    driver: local