[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reqmantool"
dynamic = ["version"]
description = "Local requirements management (DOORS-style modules, links, baselines) with a web UI"
requires-python = ">=3.11"
# SPDX expression (PEP 639); see LICENSING.md. The release build
# (etc/build-dist.sh) copies LICENSE next to this file so it is bundled as
# the license file.
license = "AGPL-3.0-only"
authors = [{ name = "Marcin Kwiatkowski" }]
classifiers = [
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
# Keep in sync with requirements.txt (the venv workflow of etc/start-backend.sh).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "reqif>=0.0.60",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "keyring>=25.0",
]

[project.optional-dependencies]
# Test-only dependencies (requirements-dev.txt for the venv workflow).
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
reqman = "reqman.cli:main"

[tool.setuptools.packages.find]
# reqman plus its data directories (templates, prompts, static), which
# setuptools treats as namespace packages.
include = ["reqman", "reqman.*"]

[tool.setuptools.dynamic]
version = { attr = "reqman.__version__" }

[tool.setuptools.package-data]
# Built-in templates and prompts; the built frontend (reqman/static) and the
# build id (reqman/BUILD) are written by etc/build-dist.sh and absent in a
# plain checkout.
reqman = ["BUILD"]
"reqman.templates" = ["*.json"]
"reqman.templates.modules" = ["*.json"]
"reqman.prompts" = ["*.json"]
"reqman.static" = ["*"]
"reqman.static.assets" = ["*"]
