# ReqManTool - Build Distros, Documentation, and Deploy
#
# - Backend/frontend checks are in ci.yml; this workflow builds artifacts.
# - Push to main: build docs (no deploy).
# - Push of a `v*` tag: build wheel/sdist, build docs, deploy docs to
#   GitHub Pages, and attach the distros to a GitHub Release.

name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─── Build Distro (Wheel + SDist, tag only) ─────────────────────────────
  build-distro:
    name: Build Distribution (Wheel + SDist)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: python -m pip install build
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Copy frontend to backend
        run: |
          cp -r frontend/dist backend/reqman/static
          echo "$(cd backend && git log -1 --format='%h (%ci)')" > backend/reqman/BUILD
      - name: Build wheel and sdist
        run: |
          cd backend
          python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/
          retention-days: 30

  # ─── Build Documentation (Doxygen + Sphinx) ─────────────────────────────
  build-docs:
    name: Build Documentation (Doxygen + Sphinx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          python -m pip install sphinx sphinx-rtd-theme sphinx-copybutton sphinx-tabs myst-parser
      - name: Stamp version into Doxygen and Sphinx configs
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          sed -i "s/@REQMAN_VERSION@/${VERSION}/g" quality/docs/Doxyfile
          sed -i "s/@REQMAN_VERSION@/${VERSION}/g" docs/sphinx/conf.py
      - name: Run Doxygen
        working-directory: quality/docs
        run: |
          mkdir -p build/docs
          doxygen Doxyfile
      - name: Build Sphinx docs
        run: sphinx-build -b html docs/sphinx docs/sphinx/_build/html
      - name: Assemble single documentation site
        run: |
          rm -rf site
          mkdir -p site
          cp -r docs/sphinx/_build/html/. site/
          mkdir -p site/doxygen
          cp -r quality/docs/build/docs/html/. site/doxygen/
          test -f site/index.html
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
          retention-days: 30

  # ─── Deploy Documentation to GitHub Pages (tag only) ────────────────────
  deploy-docs:
    name: Deploy Documentation to GitHub Pages
    needs: [build-docs]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: ./site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── Create GitHub Release (tag only) ───────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-distro]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
