# ReqManTool Desktop App - Build, Test and Release
#
# Builds the macOS DMG (universal), Windows MSI + NSIS installer and Linux
# AppImage on every push to main, every pull request and every release tag,
# runs a smoke test on each package, and attaches them to the GitHub release
# when the run is a `v*` tag.
#
# The app answers `--version` without starting the GUI, which is what the
# smoke tests use to prove the bundled binary runs on that platform.

name: Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not throw away the packages of the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            # rustup has no `universal-apple-darwin` target: Tauri builds both
            # architectures and merges them.
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: dmg
            upload_name: ReqManTool-macOS
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact: msi
            upload_name: ReqManTool-Windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact: appimage
            upload_name: ReqManTool-Linux

    # The "Prepare Python backend" step is POSIX shell script (heredoc, cp -r)
    # and the runners default to PowerShell on Windows.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            git \
            curl \
            python3 \
            python3-venv \
            python3-pip

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install python3 git

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-tauri

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            desktop/node_modules
            frontend/node_modules
          key: ${{ matrix.os }}-node-${{ hashFiles('frontend/package-lock.json', 'desktop/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install desktop dependencies (Tauri CLI)
        working-directory: ./desktop
        run: npm ci

      - name: Prepare Python backend
        run: |
          # Create backend bundle
          mkdir -p desktop/src-tauri/backend

          # Copy backend source (reqman_server is copied for the bundled app;
          # reqman/middleware.py no longer imports it, so the wheel is clean)
          cp -r backend/reqman desktop/src-tauri/backend/
          cp -r backend/reqman_server desktop/src-tauri/backend/
          cp backend/requirements.txt desktop/src-tauri/backend/
          cp backend/pyproject.toml desktop/src-tauri/backend/
          cp LICENSE desktop/src-tauri/backend/

          # Create a minimal entry point
          cat > desktop/src-tauri/backend/__main__.py << 'EOF'
          """python -m reqman runs the CLI."""
          import sys
          from reqman.cli import main
          sys.exit(main())
          EOF

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./desktop
          args: --target ${{ matrix.target }}
          # Ensure we're building release
          cargoArgs: --release

      - name: Debug build artifacts
        run: |
          echo "=== Build artifacts ==="
          echo "Target: ${{ matrix.target }}"
          echo "Artifact type: ${{ matrix.artifact }}"
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name "*.${{ matrix.artifact }}" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.msi" \) | head -20
          echo "=== Full bundle tree ==="
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.${{ matrix.artifact }}
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
          retention-days: 30

  # Smoke test: the package installs/starts and the binary answers `--version`.
  test:
    name: Test ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'macos-latest' && 'ReqManTool-macOS' || matrix.os == 'windows-latest' && 'ReqManTool-Windows' || 'ReqManTool-Linux' }}
          path: artifact

      - name: Test macOS
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          echo "=== Searching for DMG ==="
          DMG=$(find artifact -type f -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "No DMG found in artifact directory"
            find artifact -type f
            exit 1
          fi
          echo "Found DMG: $DMG"
          hdiutil attach "$DMG"
          # Find the mounted volume (might not be exactly "ReqManTool")
          VOLUME=$(hdiutil info | grep -E '/Volumes/.*ReqManTool' | head -1 | awk '{print $1}' | xargs -I {} hdiutil info | grep -B1 {} | grep 'image-path' | head -1 | cut -d' ' -f3-)
          if [ -z "$VOLUME" ]; then
            VOLUME="/Volumes/ReqManTool"
          fi
          echo "Mounted at: $VOLUME"
          "$VOLUME/ReqManTool.app/Contents/MacOS/ReqManTool" --version
          hdiutil detach "$VOLUME"

      - name: Test Windows
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host "=== Searching for MSI ==="
          $msiFiles = Get-ChildItem artifact -Recurse -Filter "*.msi" -File
          if (-not $msiFiles) {
            Write-Error "No MSI found in artifact directory"
            Get-ChildItem artifact -Recurse
            exit 1
          }
          $msi = $msiFiles[0].FullName
          Write-Host "Found MSI: $msi"

          msiexec /i $msi /qn /norestart
          if ($LASTEXITCODE -ne 0) { throw "msiexec install failed: $LASTEXITCODE" }

          # The install location is wherever the MSI decided to put it; ask
          # the uninstall registry entries instead of guessing a path.
          $entry = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "ReqManTool*" } | Select-Object -First 1
          if (-not $entry) {
            $entry = Get-ItemProperty "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "ReqManTool*" } | Select-Object -First 1
          }
          if (-not $entry -or -not $entry.InstallLocation) { throw "ReqManTool was not registered after install" }

          $exe = Join-Path $entry.InstallLocation "ReqManTool.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "$exe --version failed: $LASTEXITCODE" }

          msiexec /x $msi /qn
          if ($LASTEXITCODE -ne 0) { throw "msiexec uninstall failed: $LASTEXITCODE" }

      - name: Test Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          # Runners have no usable /dev/fuse for every image.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          echo "=== Searching for AppImage ==="
          APPIMAGE=$(find artifact -type f -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found in artifact directory"
            find artifact -type f
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --version

  # Attach the packages of a release tag to the GitHub release.
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create checksums
        run: |
          cd artifacts
          for file in */*.dmg */*.msi */*.exe */*.AppImage; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

      - name: Create release with packages
        uses: softprops/action-gh-release@v2
        with:
          name: ReqManTool ${{ github.ref_name }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/SHA256SUMS.txt
          body: |
            ## ReqManTool Desktop App ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/bula173/ReqManTool/blob/main/CHANGELOG.md) for the changes.

            ### Installation
            - **macOS**: download the `.dmg`, open it, drag ReqManTool to Applications
            - **Windows**: run the `.msi` (or the `-setup.exe`)
            - **Linux**: download the `.AppImage`, `chmod +x`, run it

            ### Requirements
            - Python 3.11+ on the machine (found as `python3`, `python` or the `py` launcher)
            - Git, for the version history features
            - WebView2 Runtime on Windows (the installer offers to fetch it)

            ### First run
            The app asks whether to start a local instance or to connect to an
            existing ReqManTool server; the choice and the server address are
            remembered (tray menu: *Local instance* / *Server address…*). For a
            local instance you are then asked for a data folder.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
