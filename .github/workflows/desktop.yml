# ReqManTool Desktop App - Build, Test and Release
#
# Builds the macOS DMG (universal) and Windows MSI + NSIS installer on every
# push to main, every pull request and every release tag,
# runs a smoke test on each package, and attaches them to the GitHub release
# when the run is a `v*` tag.
#
# The app answers `--version` without starting the GUI, which is what the
# smoke tests use to prove the bundled binary runs on that platform.

name: Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not throw away the packages of the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            # rustup has no `universal-apple-darwin` target: Tauri builds both
            # architectures and merges them.
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: dmg
            upload_name: ReqManTool-macOS
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact: msi
            upload_name: ReqManTool-Windows
    # The "Prepare Python backend" step is POSIX shell script (heredoc, cp -r)
    # and the runners default to PowerShell on Windows.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json


      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install python3 git

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-tauri

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            desktop/node_modules
            frontend/node_modules
          key: ${{ matrix.os }}-node-${{ hashFiles('frontend/package-lock.json', 'desktop/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install desktop dependencies (Tauri CLI)
        working-directory: ./desktop
        run: npm ci

      - name: Build Desktop App via PowerShell
        shell: pwsh
        run: |
          # Ensure PowerShell execution policy allows script running
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          # Run the unified build script which handles frontend, backend, Tauri build, and copies installers to dist/desktop
          .\etc\build-dist.ps1 --desktop

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: dist/desktop/*
          retention-days: 30

  # Smoke test: the package installs/starts and the binary answers `--version`.
  test:
    name: Test ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'macos-latest' && 'ReqManTool-macOS' || 'ReqManTool-Windows' }}
          path: artifact

      - name: Test macOS
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          echo "=== Searching for DMG ==="
          DMG=$(find artifact -type f -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "No DMG found in artifact directory"
            find artifact -type f
            exit 1
          fi
          echo "Found DMG: $DMG"
          hdiutil attach "$DMG"
          # Find the mounted volume (might not be exactly "ReqManTool")
          VOLUME=$(hdiutil info | grep -E '/Volumes/.*ReqManTool' | head -1 | awk '{print $1}' | xargs -I {} hdiutil info | grep -B1 {} | grep 'image-path' | head -1 | cut -d' ' -f3-)
          if [ -z "$VOLUME" ]; then
            VOLUME="/Volumes/ReqManTool"
          fi
          echo "Mounted at: $VOLUME"
          "$VOLUME/ReqManTool.app/Contents/MacOS/ReqManTool" --version
          echo "Version check passed, detaching..."
          hdiutil detach "$VOLUME"
          echo "Detached successfully"

      - name: Test Windows
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host "=== Searching for MSI ==="
          $msiFiles = Get-ChildItem artifact -Recurse -Filter "*.msi" -File
          if (-not $msiFiles) {
            Write-Error "No MSI found in artifact directory"
            Get-ChildItem artifact -Recurse
            exit 1
          }
          $msi = $msiFiles[0].FullName
          Write-Host "Found MSI: $msi"

          # Install with verbose logging to capture any errors
          $logFile = "msi_install.log"
          Write-Host "Installing MSI with verbose logging to $logFile..."
          $process = Start-Process msiexec -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "$logFile" -Wait -PassThru
          $exitCode = $process.ExitCode
          Write-Host "msiexec exit code: $exitCode"
          if ($exitCode -ne 0) {
            Write-Error "msiexec install failed with exit code $exitCode"
            if (Test-Path $logFile) { Get-Content $logFile }
            exit $exitCode
          }

          # The install location is wherever the MSI decided to put it; ask
          # the uninstall registry entries instead of guessing a path.
          $entry = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "ReqManTool*" } | Select-Object -First 1
          if (-not $entry) {
            $entry = Get-ItemProperty "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "ReqManTool*" } | Select-Object -First 1
          }
          if (-not $entry -or -not $entry.InstallLocation) { throw "ReqManTool was not registered after install" }

          $exe = Join-Path $entry.InstallLocation "ReqManTool.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "$exe --version failed: $LASTEXITCODE" }

          msiexec /x $msi /qn
          if ($LASTEXITCODE -ne 0) { throw "msiexec uninstall failed: $LASTEXITCODE" }

  # Attach the packages of a release tag to the GitHub release.
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create checksums
        run: |
          cd artifacts
          for file in */*.dmg */*.msi */*.exe; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

      - name: Create release with packages
        uses: softprops/action-gh-release@v2
        with:
          name: ReqManTool ${{ github.ref_name }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            
            artifacts/SHA256SUMS.txt
          body: |
            ## ReqManTool Desktop App ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/bula173/ReqManTool/blob/main/CHANGELOG.md) for the changes.

            ### Installation
            - **macOS**: download the `.dmg`, open it, drag ReqManTool to Applications
            - **Windows**: run the `.msi` (or the `-setup.exe`)

            ### Requirements
            - Python 3.11+ on the machine (found as `python3`, `python` or the `py` launcher)
            - Git, for the version history features
            - WebView2 Runtime on Windows (the installer offers to fetch it)
            - macOS 10.15+ or Windows 10+

            ### First run
            The app asks whether to start a local instance or to connect to an
            existing ReqManTool server; the choice and the server address are
            remembered (tray menu: *Local instance* / *Server address…*). For a
            local instance you are then asked for a data folder.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
