# ReqManTool Desktop App - Build and Release
# Builds macOS DMG, Windows MSI, and Linux AppImage on each release

name: Desktop App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.3)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            artifact: dmg
            upload_name: ReqManTool-macOS
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: msi
            upload_name: ReqManTool-Windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: appimage
            upload_name: ReqManTool-Linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            git \
            curl \
            python3 \
            python3-venv \
            python3-pip

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install python3 git

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-tauri

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            desktop/node_modules
          key: ${{ matrix.os }}-node-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_TAURI: "true"

      - name: Prepare Python backend
        run: |
          # Create backend bundle
          mkdir -p desktop/src-tauri/backend
          
          # Copy backend source (reqman_server too: reqman/middleware.py
          # imports reqman_server.settings)
          cp -r backend/reqman desktop/src-tauri/backend/
          cp -r backend/reqman_server desktop/src-tauri/backend/
          cp -r backend/reqman/templates desktop/src-tauri/backend/
          cp -r backend/reqman/prompts desktop/src-tauri/backend/
          cp backend/requirements.txt desktop/src-tauri/backend/
          cp backend/pyproject.toml desktop/src-tauri/backend/
          cp backend/README.md desktop/src-tauri/backend/ 2>/dev/null || true
          cp LICENSE desktop/src-tauri/backend/
          
          # Create a minimal entry point
          cat > desktop/src-tauri/backend/__main__.py << 'EOF'
"""python -m reqman runs the CLI."""
import sys
from reqman.cli import main
sys.exit(main())
EOF

      - name: Build Tauri app
        working-directory: ./desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ReqManTool ${{ github.ref_name }}"
          releaseBody: |
            ## ReqManTool Desktop App ${{ github.ref_name }}
            
            ### Changes
            See [CHANGELOG.md](https://github.com/bula173/ReqManTool/blob/main/CHANGELOG.md)
            
            ### Installation
            - **macOS**: Download `.dmg`, open it, and drag ReqManTool to Applications
            - **Windows**: Download `.msi` and run the installer
            - **Linux**: Download `.AppImage`, make it executable (`chmod +x`), and run
            
            ### Requirements
            - Python 3.11+ (bundled on Windows/macOS, system on Linux)
            - Git (for version history features)
            
            ### First Run
            On first launch, you'll be asked to choose a data folder (default: `~/ReqManData`).
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.${{ matrix.artifact }}
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          retention-days: 30

  # Create combined release
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create checksums
        run: |
          cd artifacts
          for file in */*.dmg */*.msi */*.AppImage; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

      - name: Update release with checksums
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Test the built app (smoke test)
  test:
    name: Test ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'macos-latest' && 'ReqManTool-macOS' || matrix.os == 'windows-latest' && 'ReqManTool-Windows' || 'ReqManTool-Linux' }}
          path: artifact

      - name: Test macOS
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil attach artifact/*.dmg
          "/Volumes/ReqManTool/ReqManTool.app/Contents/MacOS/ReqManTool" --version
          hdiutil detach "/Volumes/ReqManTool"

      - name: Test Windows
        if: matrix.os == 'windows-latest'
        run: |
          msiexec /i artifact/*.msi /qn /norestart
          "$env:LOCALAPPDATA\ReqManTool\ReqManTool.exe" --version
          msiexec /x artifact/*.msi /qn

      - name: Test Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x artifact/*.AppImage
          ./artifact/*.AppImage --version