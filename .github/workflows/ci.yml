name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    env:
      # Provider tokens stay in memory: CI has no OS keychain.
      REQMAN_TOKEN_STORE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run mypy (non-blocking, Qual. G8)
        run: python -m mypy --ignore-missing-imports reqman/ || true
      - name: Run ruff (non-blocking, Qual. G8)
        run: python -m ruff check reqman/ || true
      - name: Run pip-audit (non-blocking)
        run: python -m pip install pip-audit && python -m pip_audit -r requirements.txt --format=json --output=pip-audit.json || true
      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-${{ matrix.python-version }}
          path: backend/pip-audit.json
          retention-days: 30
      - name: Run pytest with coverage
        run: python -m pytest -q --cov=reqman --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: backend/coverage.xml
          retention-days: 30

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (non-blocking)
        run: npm audit --audit-level=high --json > npm-audit.json || true
      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: frontend/npm-audit.json
          retention-days: 30
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
