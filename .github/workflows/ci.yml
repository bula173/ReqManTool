name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write  # for uploading SARIF results

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: backend
    env:
      # Provider tokens stay in memory: CI has no OS keychain.
      REQMAN_TOKEN_STORE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install static analysis tools
        run: python -m pip install mypy ruff mutmut
      - name: Run mypy (non-strict for now, will enable strict later)
        run: python -m mypy --ignore-missing-imports reqman/ || true
      - name: Run ruff (warnings only for now)
        run: python -m ruff check reqman/ || true
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --format=json --output=pip-audit.json || true
      - name: Upload pip-audit results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit.json
          category: pip-audit
      - name: Run pytest with coverage
        run: python -m pytest -q --cov=reqman --cov-fail-under=70 --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false
      - name: Run mutation testing (service.py only, non-blocking)
        run: |
          python -m mutmut run --source-dirs=reqman/service.py --runner="python -m pytest -x -q --ignore=tests/test_server_discovery.py --ignore=tests/test_server_login_account.py --ignore=tests/test_git_remotes.py --ignore=tests/test_login_publish_push.py --ignore=tests/test_git_baselines.py --ignore=tests/test_git_baselines_edge_cases.py --ignore=tests/test_git_remotes_edge_cases.py --ignore=tests/test_git_history_conflicts_and_isolation.py --ignore=tests/test_git_history_safety.py" --max-runtime=300 || true
          python -m mutmut results --print-all || true

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high --json > npm-audit.json || true
      - name: Upload npm audit results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: npm-audit.json
          category: npm-audit
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
